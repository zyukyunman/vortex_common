[project]
name = "vortextool"
version = "0.1.0"
description = "Vortex 配置真值源生成/校验工具（registry.yml → env/versions/docs）"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vortextool"]
