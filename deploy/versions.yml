# ============================================================================
# Vortex 组合镜像的各仓版本清单（每仓库各自 tag）。
#
# 发版 = 改下面某个服务的 ref（tag/commit/分支）→ 提交本文件。该提交即这套组合的
# 发布点。然后 deploy/build-release.sh 会按各 ref 浅克隆代码、构建出 vortex:<tag> 镜像。
#
# 字段：
#   name       服务名（对应 /app/services/<name> 与 vortexctl 的子命令）
#   repo       git 仓库地址（私有仓由你本机的 SSH/凭据克隆，凭据不入镜像）
#   ref        git tag / 分支 / commit；留空 = 该服务暂不纳入（如 trader 预留）
#   submodules 可选，true 表示需检出子模块（qmt 的 qmt-bridge）
#
# 解析见 build-release.sh（不依赖 PyYAML，按本固定结构用 awk 解析）。
# ============================================================================
services:
  - name: vortex_data
    repo: https://github.com/zyukyunman/vortex_data.git
    ref: main

  - name: vortex_qmt
    repo: https://github.com/zyukyunman/vortex_qmt.git
    ref: main
    submodules: true

  - name: vortex_backtest
    repo: https://github.com/zyukyunman/vortex_backtest.git
    ref: main

  # 预留：当前空仓，ref 留空则构建时跳过；将来打了 tag 再填。
  - name: vortex_trader
    repo: https://github.com/zyukyunman/vortex_trader.git
    ref:
