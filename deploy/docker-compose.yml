# ============================================================================
# Vortex 顶层编排：同一个组合镜像 vortex:<tag>，每个服务起一个容器（主部署形态）。
#
# 配置归各仓所有：每个服务的配置在它自己仓里 <仓>/.env（真名、含默认值+你填的密钥）。
#   pull-code.sh 把各仓拉到 deploy/repos/<svc>；compose 用 env_file 把该仓 .env 运行时注入
#   对应容器（改配置只需 up -d / restart，不重建镜像；.env 不进镜像）。
# environment: 只放容器内固定不变量（端口/目录/host），覆盖 .env 同名项，保证内部接线不被改坏。
# 主机侧映射（*_BIND_ADDR）默认绑回环；要对外暴露在 up 时用 shell env 覆盖绑定地址，如：
#   VORTEX_DATA_BIND_ADDR=0.0.0.0 vortex run deploy   # 对外暴露改绑定地址；端口由 registry 钉死，不再重映射
#
# 流程：deploy/pull-code.sh → 改 repos/<svc>/.env → deploy/build-release.sh → docker compose up -d
# 详见 deploy/CONFIG-AND-RUN.zh.md。须在 deploy/ 目录内执行 docker compose。
# ============================================================================
x-img: &img ${VORTEX_IMAGE:-vortex:latest}

services:
  vortex-data:
    image: *img
    command: ["vortexctl", "data"]
    container_name: vortex-data
    env_file:
      - repos/vortex_data/.env               # 该仓自己的配置（TUSHARE_TOKEN/写 token/...）
    environment:                             # 容器内固定不变量（覆盖 .env，保证内部接线）
      VORTEX_WORKSPACE: /workspace
      VORTEX_DATA_HOST: 0.0.0.0              # 容器内监听不变量（≠对外暴露），字面保留
      VORTEX_DATA_PORT: ${VORTEX_DATA_PORT:?run via 'vortex run'}
      TZ: ${TZ:?run via 'vortex run'}
    ports:
      - "${VORTEX_DATA_BIND_ADDR:?run via 'vortex run'}:${VORTEX_DATA_PORT}:${VORTEX_DATA_PORT}"
    volumes:
      - vortex-workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vortex-qmt:
    image: *img
    command: ["vortexctl", "qmt"]
    container_name: vortex-qmt
    env_file:
      - repos/vortex_qmt/.env                # 该仓自己的实盘配置（token/桥接/风控），与 data 隔离
    environment:
      VORTEX_STATE: /state                   # 标准名（ADR-002）
      VORTEX_QMT_HOST: 0.0.0.0               # 容器内监听不变量（≠对外暴露），字面保留
      VORTEX_QMT_PORT: ${VORTEX_QMT_PORT:?run via 'vortex run'}
      TZ: ${TZ:?run via 'vortex run'}
    ports:
      - "${VORTEX_QMT_BIND_ADDR:?run via 'vortex run'}:${VORTEX_QMT_PORT}:${VORTEX_QMT_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vortex-qmt-state:/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vortex-backtest:
    image: *img
    command: ["vortexctl", "backtest"]
    container_name: vortex-backtest
    env_file:
      - repos/vortex_backtest/.env           # 该仓自己的配置（写 token 等）
    environment:
      VORTEX_WORKSPACE: /workspace           # 标准名（ADR-002）
      VORTEX_STATE: /state                   # 标准名（ADR-002）
      VORTEX_BACKTEST_HOST: 0.0.0.0          # 容器内监听不变量（≠对外暴露），字面保留
      VORTEX_BACKTEST_PORT: ${VORTEX_BACKTEST_PORT:?run via 'vortex run'}
      TZ: ${TZ:?run via 'vortex run'}
    ports:
      - "${VORTEX_BACKTEST_BIND_ADDR:?run via 'vortex run'}:${VORTEX_BACKTEST_PORT}:${VORTEX_BACKTEST_PORT}"
    volumes:
      - vortex-workspace:/workspace:ro       # 消费 data 导出的数据，只读
      - vortex-backtest-state:/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 预留：trader 仓有代码并写进 versions.yml + pull-code 后，去掉 profiles 即纳入。
  vortex-trader:
    image: *img
    command: ["vortexctl", "trader"]
    container_name: vortex-trader
    profiles: ["trader"]
    env_file:
      - repos/vortex_trader/.env
    environment:
      VORTEX_STATE: /state
      VORTEX_TRADER_HOST: 0.0.0.0            # 容器内监听不变量（≠对外暴露），字面保留
      VORTEX_TRADER_PORT: ${VORTEX_TRADER_PORT:?run via 'vortex run'}
      TZ: ${TZ:?run via 'vortex run'}
    ports:
      - "${VORTEX_TRADER_BIND_ADDR:?run via 'vortex run'}:${VORTEX_TRADER_PORT}:${VORTEX_TRADER_PORT}"
    volumes:
      - vortex-trader-state:/state
    restart: unless-stopped

volumes:
  vortex-workspace:
  vortex-qmt-state:
  vortex-backtest-state:
  vortex-trader-state:
